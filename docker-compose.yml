
services:
  postgres:
    image: postgres:16-alpine
    container_name: decisio-postgres
    ports:
      # Host port (avoids clashing with other local Postgres on 5432/5433)
      - "${DECISIO_POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-decisio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-decisio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decisio-redis
    ports:
      # Host port (avoids clashing with other local Redis on 6379)
      - "${DECISIO_REDIS_PORT:-6380}:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: decisio-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  api:
    build: .
    container_name: decisio-api
    ports:
      - "8020:8020"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-decisio}}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      WS_BASE_URL: ${WS_BASE_URL:-http://localhost:8020}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: sh -c "alembic upgrade head && exec uvicorn api:app --host 0.0.0.0 --port 8020"
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }
      redis: { condition: service_started }
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_storage:
