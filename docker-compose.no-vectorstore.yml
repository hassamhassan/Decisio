# Decisio — deploy WITHOUT vector store (PostgreSQL + API + frontend only)
# Retrieval agent is disabled; the app uses LLM-only reasoning.
# Usage: docker compose -f docker-compose.no-vectorstore.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: decisio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-decisio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-decisio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decisio-redis
    restart: unless-stopped

  api:
    build: .
    container_name: decisio-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-decisio}}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      WS_BASE_URL: ${WS_BASE_URL:-http://localhost:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    command: sh -c "alembic upgrade head && exec uvicorn api:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

volumes:
  postgres_data:
